name: CI/CD

on:
  push:
    branches:
      - '*'
  pull_request:
    branches: [develop]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8

    - name: Lint
      run: flake8 .

    - name: Test
      run: python manage.py test
      env:
        DJANGO_SETTINGS_MODULE: config.settings

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v3

    - name: Build Docker image
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/drf-project:${{ github.sha }} .

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Push image
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/drf-project:${{ github.sha }}
        docker tag ${{ secrets.DOCKER_USERNAME }}/drf-project:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/drf-project:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/drf-project:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Deploy to server
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd /opt/drf-project
          docker pull ${{ secrets.DOCKER_USERNAME }}/drf-project:latest
          docker-compose down
          docker-compose up -d
          docker system prune -f

