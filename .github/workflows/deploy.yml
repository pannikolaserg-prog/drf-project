name: CI/CD

on:
  push:
    branches:
      - '*'
  pull_request:
    branches: [develop]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
    - uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install PostgreSQL client
      run: |
        sudo apt-get update
        sudo apt-get install -y postgresql-client

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8

    - name: Lint
      run: flake8 .

    - name: Wait for PostgreSQL
      run: |
        echo "Waiting for PostgreSQL to be ready..."
        for i in {1..30}; do
          if PGPASSWORD=test_password pg_isready -h localhost -p 5432 -U test_user; then
            echo "PostgreSQL is ready!"
            exit 0
          fi
          echo "Waiting... (${i}/30)"
          sleep 2
        done
        echo "PostgreSQL is not ready after 60 seconds"
        exit 1

    - name: Run migrations
      env:
        DB_NAME: test_db
        DB_USER: test_user
        DB_PASSWORD: test_password
        DB_HOST: localhost
        DB_PORT: 5432
        SECRET_KEY: "django-insecure-test-key"
      run: python manage.py migrate

    - name: Test
      run: python manage.py test
      env:
        DJANGO_SETTINGS_MODULE: config.settings
        SECRET_KEY: "django-insecure-test-key-12345"
        DEBUG: "False"
        DB_NAME: "test_db"
        DB_USER: "test_user"
        DB_PASSWORD: "test_password"
        DB_HOST: "localhost"
        DB_PORT: "5432"

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v3

    - name: Build Docker image
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/drf-project:${{ github.sha }} .

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Push image
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/drf-project:${{ github.sha }}
        docker tag ${{ secrets.DOCKER_USERNAME }}/drf-project:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/drf-project:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/drf-project:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Deploy to server
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd /opt/drf-project
          docker pull ${{ secrets.DOCKER_USERNAME }}/drf-project:latest
          docker-compose down
          docker-compose up -d
          docker system prune -f
