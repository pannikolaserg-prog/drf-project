name: CI/CD

on:
  push:
    branches:
      - '*'
  pull_request:
    branches: [develop]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8

    - name: Lint
      run: flake8 .

    - name: Run migrations
      env:
        DB_NAME: test_db
        DB_USER: test_user
        DB_PASSWORD: test_password
        DB_HOST: localhost
        DB_PORT: 5432
        SECRET_KEY: "django-insecure-test-key"
      run: python manage.py migrate

    - name: Test
      run: python manage.py test
      env:
        DJANGO_SETTINGS_MODULE: config.settings
        SECRET_KEY: "django-insecure-test-key-12345"  # 👈 добавить
        DEBUG: "False"                                 # 👈 добавить
        DB_NAME: "test_db"                            # 👈 добавить
        DB_USER: "test_user"                          # 👈 добавить
        DB_PASSWORD: "test_password"                  # 👈 добавить
        DB_HOST: "localhost"                          # 👈 добавить
        DB_PORT: "5432"

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v3

    - name: Build Docker image
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/drf-project:${{ github.sha }} .

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Push image
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/drf-project:${{ github.sha }}
        docker tag ${{ secrets.DOCKER_USERNAME }}/drf-project:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/drf-project:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/drf-project:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Deploy to server
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd /opt/drf-project
          docker pull ${{ secrets.DOCKER_USERNAME }}/drf-project:latest
          docker-compose down
          docker-compose up -d
          docker system prune -f
